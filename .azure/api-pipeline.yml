trigger:
  branches:
    include:
      - master
  paths:
    include:
      - api/**
      - .azure/api-pipeline.yml

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: '8.x'
  azureSubscription: 'LughatAI-Azure-Connection'      # Azure DevOps service connection name
  appServiceName: 'lughatai-prod-api'
  resourceGroup: 'lughatai-prod-rg'

stages:
  # ── Build & Test ───────────────────────────────────────────────────────────
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: BuildJob
        displayName: Build API
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 8
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: Restore packages
            inputs:
              command: restore
              projects: api/**/*.csproj

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: api/**/*.csproj
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Run tests
            inputs:
              command: test
              projects: api/**/*.Tests.csproj
              arguments: --configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"
            continueOnError: false

          - task: DotNetCoreCLI@2
            displayName: Publish
            inputs:
              command: publish
              publishWebProjects: false
              projects: api/LughatAI.Api.csproj
              arguments: --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/api
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: Publish artifact
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)/api
              artifactName: api-drop

  # ── Deploy to Production ───────────────────────────────────────────────────
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: DeployAPI
        displayName: Deploy API to App Service
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: Download artifact
                  inputs:
                    artifactName: api-drop

                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(appServiceName)
                    resourceGroupName: $(resourceGroup)
                    package: $(Pipeline.Workspace)/api-drop/*.zip
                    runtimeStack: DOTNETCORE|8.0
                    deploymentMethod: zipDeploy

                - task: AzureAppServiceSettings@1
                  displayName: Verify app is healthy
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(appServiceName)
                    resourceGroupName: $(resourceGroup)

  # ── Run DB Migrations ──────────────────────────────────────────────────────
  - stage: Migrate
    displayName: Run DB Migrations
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: MigrateJob
        displayName: EF Core Migrations
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: Install EF Core tools
            inputs:
              command: custom
              custom: tool
              arguments: install --global dotnet-ef

          - task: DotNetCoreCLI@2
            displayName: Run migrations
            inputs:
              command: custom
              custom: ef
              arguments: database update --project api/LughatAI.Api.csproj --no-build
            env:
              ConnectionStrings__Default: $(DbConnectionString) # from variable group
