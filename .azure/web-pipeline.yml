trigger:
  branches:
    include:
      - master
  paths:
    include:
      - web/**
      - .azure/web-pipeline.yml

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  azureSubscription: 'LughatAI-Azure-Connection'
  appServiceName: 'lughatai-prod-web'
  resourceGroup: 'lughatai-prod-rg'

stages:
  # ── Build ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: Build and Lint
    jobs:
      - job: BuildJob
        displayName: Next.js Build
        steps:
          - task: NodeTool@0
            displayName: Use Node 20
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: Cache node_modules
            inputs:
              key: 'npm | "$(Agent.OS)" | web/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: web/node_modules

          - script: npm ci
            displayName: npm install
            workingDirectory: web

          - script: npm run lint
            displayName: ESLint
            workingDirectory: web

          - script: npm run build
            displayName: Next.js build
            workingDirectory: web
            env:
              NEXT_PUBLIC_API_URL: $(ApiBaseUrl)  # from variable group

          - task: ArchiveFiles@2
            displayName: Zip build output
            inputs:
              rootFolderOrFile: web/.next
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/web-$(Build.BuildId).zip

          - task: PublishBuildArtifacts@1
            displayName: Publish artifact
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)
              artifactName: web-drop

  # ── E2E Tests ──────────────────────────────────────────────────────────────
  - stage: E2ETest
    displayName: Playwright E2E Tests
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: E2EJob
        displayName: Run Playwright Tests
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: web

          - script: npx playwright install --with-deps chromium
            displayName: Install Playwright browsers
            workingDirectory: web

          - script: npx playwright test
            displayName: Run E2E tests
            workingDirectory: web
            env:
              BASE_URL: $(StagingApiUrl)
              CI: true

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: web/e2e/results/*.xml

  # ── Deploy ─────────────────────────────────────────────────────────────────
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: E2ETest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: DeployWeb
        displayName: Deploy Next.js to App Service
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  inputs:
                    artifactName: web-drop

                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(appServiceName)
                    resourceGroupName: $(resourceGroup)
                    package: $(Pipeline.Workspace)/web-drop/web-$(Build.BuildId).zip
                    runtimeStack: NODE|20-lts
                    startUpCommand: 'node server.js'
